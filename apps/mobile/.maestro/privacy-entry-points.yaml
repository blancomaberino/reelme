# Privacy & data — reachability and the typed delete gate (E2E, iOS simulator).
#
# Two things jest cannot prove about this screen:
#
#  1. That a user can GET here. `render(<PrivacyScreen/>)` bypasses navigation
#     entirely, so a screen with no row pointing at it passes every unit test.
#  2. That the confirm gate holds ON DEVICE. In jest a disabled Pressable still
#     receives the synthetic press and the handler is simply not called; on a
#     real screen the question is whether the tap lands on the button at all.
#     "Delete everything" is the last control in the app that should be
#     ambiguous about it — and unlike every other flow here, getting this wrong
#     once destroys the account the flow is running as.
#
# THIS FLOW DELIBERATELY STOPS SHORT of confirming the deletion. It types the
# word, checks the button comes alive, and cancels. Actually pressing confirm
# would delete the dev account and leave the next run with nothing to log in
# as — the API side of the delete is covered by Pest, which can afford it.
#
# The app runs in Spanish (the default locale), so the labels below are the es
# strings, not the en ones the unit tests assert on.
#
# Preconditions: API stack + Metro up (`./scripts/dev.sh start`) and the app
# logged in — the Privacy row is authed-only, so a signed-out run proves nothing
# and will fail at the "Seguridad" step.
#
# Run: ~/.maestro/bin/maestro test apps/mobile/.maestro/privacy-entry-points.yaml
#
# Navigation is by tapping real controls, never a deep link — one of those sets
# the app's launch URL and strands the next Cmd+R on this screen.
appId: pet.one.reelmap
---
- launchApp

# --- Reachability: profile tab -> Ajustes -> Privacidad y datos -------------
- extendedWaitUntil:
    visible: ".*Perfil.*"
    timeout: 60000
- tapOn: ".*Perfil, tab.*"

# Waited on by id, then tapped by POINT.
#
# 2026-08-13: this used to tap a hardcoded `point: "50%,69%"`, with a comment
# explaining that `tapOn: "Ajustes"` "lands on Invitar amigos". Both the
# workaround and the diagnosis were wrong, and the flow had silently started
# FAILING — 69% was measured before the profile screen gained a row, so it had
# drifted onto "Invitar amigos" itself and never reached a privacy assertion.
#
# The real cause: the profile screen loads its counters asynchronously and the
# rows below shift when they arrive, so a tap fired into that window lands on
# whatever was there a moment earlier. It was never the selector — it was
# tapping a moving screen. Waiting for the layout to settle makes the semantic
# selector work (measured 1/3 without the wait, 4/4 with it) and removes the
# magic number that rots every time a row is added.
- extendedWaitUntil:
    visible:
      id: "profile-settings"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 10000
- tapOn: "Ajustes"
- extendedWaitUntil:
    visible: "Seguridad"
    timeout: 20000

# The row sits under Seguridad, below the fold on a 6.9" screen — and Maestro
# does NOT scroll on its own for `tapOn`. Scrolling here is part of the
# reachability claim, not test scaffolding: this is what the user does.
- scrollUntilVisible:
    element:
      id: "settings-privacy"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "settings-privacy"
- extendedWaitUntil:
    visible: "Privacidad y datos"
    timeout: 20000

# --- Both rights are live now (T-050) --------------------------------------
# The "not available yet" notice must be GONE: it shipped with T-039 while the
# endpoints did not exist, and a stale one would be the screen lying about
# itself in the one place that must not.
- assertNotVisible: "Todavía no disponible"
- assertVisible: "Obtener una copia de mis datos"
- assertVisible: "Eliminar mi cuenta"
- takeScreenshot: build/maestro/privacy-entry-points

# --- The delete gate: opening it must NOT delete anything -------------------
- tapOn:
    id: "privacy-delete-action"
- extendedWaitUntil:
    visible: "¿Eliminar tu cuenta?"
    timeout: 10000
- assertVisible: "Escribí ELIMINAR para confirmar"
- takeScreenshot: build/maestro/privacy-delete-confirm

# A half-typed word is not a decision. Asserted before the full word so a
# confirm button that was live from the start fails HERE, one step before the
# step that would have proven it by deleting the account.
- tapOn:
    id: "privacy-delete-confirm-input"
- inputText: "ELIMIN"
- assertVisible:
    id: "privacy-delete-confirm"
    enabled: false

- eraseText
- inputText: "ELIMINAR"
- assertVisible:
    id: "privacy-delete-confirm"
    enabled: true

# --- Back out. See the header comment: we do not press confirm. ------------
- tapOn:
    id: "privacy-delete-cancel"
- assertNotVisible: "¿Eliminar tu cuenta?"
- assertVisible: "Privacidad y datos"

# Re-opening starts from a dead button — a sheet that remembered the typed word
# would leave "Eliminar todo" one tap away on the next visit.
- tapOn:
    id: "privacy-delete-action"
- assertVisible:
    id: "privacy-delete-confirm"
    enabled: false
- tapOn:
    id: "privacy-delete-cancel"

# --- Export is safe to actually run ----------------------------------------
# NOTE: /me/export is throttled 5/min. Running this flow several times inside a
# minute trips the limiter and this step fails with the generic error alert —
# which is the throttle working, not a regression. Wait a minute between runs.
- tapOn:
    id: "privacy-export-action"
- extendedWaitUntil:
    visible: "Tu copia está en camino"
    timeout: 20000
- takeScreenshot: build/maestro/privacy-export-requested

# --- Leave the app where we found it ---------------------------------------
# CLAUDE.md asks for the restore to be VERIFIED, not asserted, and twice it has
# been reported fixed without that check. Doing it here makes the guarantee part
# of the flow instead of a step someone has to remember: stop, launch with no
# URL (what Cmd+R replays), and confirm we land on the map — not back on this
# screen.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Filtros"
    timeout: 60000
- assertNotVisible: "Privacidad y datos"
