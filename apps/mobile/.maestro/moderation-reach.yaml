# From a place to the controls that act on it (E2E, iOS simulator).
#
# The two paths Apple 1.2 is actually checked on, walked the way a person
# reaches them — from a PLACE, which is where you meet somebody else's content.
#
# What jest cannot prove here, and why this exists:
#
#  1. The handles are `Pressable`s nested INSIDE the card's own Pressable.
#     React Native gives the touch to the innermost responder, so this works —
#     but a test that mounts the screen and fires a synthetic press would pass
#     either way. Only a real view hierarchy can swallow the tap.
#  2. Reachability. The place screen's handle was styled to look tappable and
#     left inert from T-033 until T-054's follow-up; every unit test passed
#     throughout, because none of them asked whether anyone could GET to a
#     profile. Search (you must already know the handle) and follow lists were
#     the only routes.
#  3. That the review report reaches its own endpoint with its own reason set.
#
# PRECONDITIONS
#   - API stack + Metro up via `./scripts/dev.sh start` — NOT a bare
#     `npx expo start`, which drops EXPO_PUBLIC_API_URL and makes every request
#     look like the device is offline.
#   - Logged in, and "Mis lugares" contains **Kraken** — this flow names that
#     place throughout rather than taking "the first row", so the place it
#     opens, the influencer it reaches, and the place carrying the seeded
#     review are all the same one by construction.
#   - Kraken's source card must carry an INFLUENCER credit (the flow asserts
#     this up front, so a fixture without one fails where the message helps).
#   - PART 2 needs a native review BY ANOTHER USER on that place — the list
#     excludes your own, so a self-written one renders no report control. Seed
#     and remove it around the run:
#
#       php artisan tinker --execute="\
#         \$p = App\Models\Place::where('slug','like','kraken%')->first();\
#         \$u = App\Models\User::where('username','jacey.langysjv')->first();\
#         App\Models\Review::create(['place_id'=>\$p->id,'user_id'=>\$u->id,\
#           'rating'=>5,'body'=>'RESENA DE PRUEBA','is_hidden'=>false]);"
#
#     …and afterwards delete that review plus any `review_reports` row, or the
#     next run reports an already-reported review and the API answers a no-op.
#
# The app runs in Spanish (the default locale), so the labels below are the es
# strings, not the en ones the unit tests assert on.
#
# Run: ~/.maestro/bin/maestro test apps/mobile/.maestro/moderation-reach.yaml
appId: pet.one.reelmap
---
- launchApp
- extendedWaitUntil:
    visible: "Filtros"
    timeout: 90000

# --- Reach a place the way a user does --------------------------------------
# Via "Mis lugares" rather than the map: map annotations are native views with
# no testIDs, so tapping a pin means guessing coordinates, and a guess that
# lands on empty water fails for reasons unrelated to what this tests.
- tapOn: ".*Mis lugares, tab.*"
- extendedWaitUntil:
    visible: "Mis lugares"
    timeout: 30000
- tapOn:
    text: "Kraken"
    index: 0
- extendedWaitUntil:
    visible: "Abrir en el mapa"
    timeout: 30000

# === PART 1 — the handle leads to the profile, and to Block =================
# Maestro does NOT scroll on its own for `tapOn`, and the source cards sit well
# below the fold.
- scrollUntilVisible:
    element:
      id: "source-sharer-.*"
    direction: DOWN
    centerElement: true
    timeout: 25000
- takeScreenshot: build/maestro/reach-1-place

# All three tap targets coexist: the CARD opens the original post, and each
# HANDLE opens its person. Asserting the card's label here is what would catch
# an inner Pressable eating the whole card.
- assertVisible: ".*Abrir publicación original.*"
- assertVisible: ".*Abrir la página de.*"
- assertVisible: ".*Abrir el perfil de.*"
- tapOn:
    id: "source-sharer-.*"

# The profile — and the control the whole path exists to reach. On your OWN
# profile there is deliberately no Block, so this asserts the profile arrived
# and leaves the Block assertion to block-user.yaml, which controls whose
# profile it lands on.
- extendedWaitUntil:
    visible: "Ver en el mapa"
    timeout: 30000
- takeScreenshot: build/maestro/reach-2-profile

# === PART 1b — the influencer handle reaches their places, and one opens ====
# Same card, the other handle. This half exists because a places LIST that
# renders and does not navigate looks perfect in a screenshot: the profile's
# counter, the list, and the map all agreed on paper while the map drew nothing
# at all, for every creator, for as long as the screen had existed.
#
# Back to the place first — part 1 left us on the SHARER's profile. Same
# animation wait as below: a back tap fired mid-push is absorbed.
- waitForAnimationToEnd:
    timeout: 6000
- tapOn: "Volver"
- extendedWaitUntil:
    visible: ".*Abrir publicación original.*"
    timeout: 30000
- tapOn:
    id: "source-influencer-.*"
- extendedWaitUntil:
    visible: ".*Ver su mapa.*"
    timeout: 30000
# BY NAME, not by index. The influencer's list is ordered by the API and this
# flow needs the one place carrying the seeded review — "the first card" is a
# different place the moment the ordering or the data changes, and the failure
# lands three steps later on a missing review, which reads as a broken report
# feature rather than a wrong fixture.
- scrollUntilVisible:
    element:
      text: "Kraken"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: build/maestro/reach-1b-influencer
- tapOn: "Kraken"
- extendedWaitUntil:
    visible: "Abrir en el mapa"
    timeout: 30000

# === PART 2 — a review can be reported ======================================
# Part 1b already left us on a PLACE — the one opened from the influencer's
# list — so there is no back-navigation to do; scroll straight to the review.
- scrollUntilVisible:
    element:
      text: "RESENA DE PRUEBA"
    direction: DOWN
    centerElement: true
    timeout: 25000

# Matched by its accessibility label, which NAMES the author — the place's own
# report control is on this same screen, and both reading just "Reportar" left
# a screen-reader user with two identical buttons doing different things.
- tapOn: "Reportar la reseña de .*"

# The REVIEW vocabulary, not the general one. `No es sobre este lugar`
# (off_topic) exists only here; `wrong_place` and `copyright` would be reasons
# the server rejects — a 422 the user reads as "reporting is broken".
- extendedWaitUntil:
    visible: "No es sobre este lugar"
    timeout: 20000
- assertNotVisible: "El lugar está mal"
# And no free-text box: the review endpoint takes a reason and NOTHING else, so
# a field here would collect an explanation and discard every word of it.
- assertNotVisible:
    id: "report-details"
- takeScreenshot: build/maestro/reach-3-review-sheet

- tapOn: "No es sobre este lugar"
- tapOn: "Enviar reporte"
- extendedWaitUntil:
    visible: ".*[Gg]racias.*"
    timeout: 20000
- takeScreenshot: build/maestro/reach-4-reported

# --- Put the simulator back --------------------------------------------------
# No deep link was used, so nothing is latched — but the map viewport moved, and
# a plain relaunch is what the next Cmd+R will do anyway.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Filtros"
    timeout: 90000
