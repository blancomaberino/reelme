# T-047 — Offers refuses honestly when location is denied, and offers the retry
# control that refusal actually calls for.
#
# WHY THIS FLOW EXISTS. The blocked branch picks BOTH its copy and its button
# from `presentRefusal(blocked)`: a permission the user turned off must offer
# "Abrir ajustes" (only the OS can flip it), while a fix that merely failed must
# offer "Probá de nuevo". `app/offers/__tests__/browse.test.tsx` mocks that
# refusal, so it proves the mapping it was handed — this proves the mapping the
# OS itself produces, on a real denial.
#
# The denial is set at launch by Maestro (`permissions: location: never`), NOT by
# `xcrun simctl privacy revoke`, which was tried first and does not reach the
# app: the screen came up with the ordinary empty list. A flow built on the
# simctl route would have passed for the wrong reason.
#
# The last two steps put the permission back. They are part of the flow rather
# than cleanup to remember, because a run that dies half-way still leaves the
# simulator denied.
#
# What this flow can NOT do is confirm that restore, and an earlier version of
# this comment claimed otherwise — it said to run `offers-location.yaml`
# afterwards. That flow launches with `permissions: location: inuse`, so it SETS
# the grant instead of reading what this run left; it passes identically whether
# the restore happened or not, and would mask exactly the failure it was cited
# for. Its own header says as much.
#
# There is no read-back to substitute: `simctl privacy` grants, revokes and
# resets, and has no status action. The only thing that observes what this run
# left is a launch that sets NO permission — open the app by hand, or run a flow
# whose `launchApp` has no `permissions:` block, and check that Offers shows the
# list rather than `offers-location-blocked`. Stated here rather than automated,
# because a verification step that quietly re-grants is worse than none.
#
# PRECONDITIONS: dev client installed, API reachable (./scripts/dev.sh run),
# locale es. No seeded offers needed — the refusal replaces the list entirely.
#
# Run: ~/.maestro/bin/maestro test apps/mobile/.maestro/offers-location-blocked.yaml

appId: pet.one.reelmap
---
- launchApp:
    permissions:
      location: never
- extendedWaitUntil:
    visible: "Filtros"
    timeout: 90000

- tapOn:
    id: "map-offers"

# The refusal — not a spinner, and not an empty list claiming there is nothing
# nearby when the truth is that we cannot know.
- extendedWaitUntil:
    visible:
      id: "offers-location-blocked"
    timeout: 30000
- assertVisible: "Activá la ubicación para ver qué hay en oferta cerca de vos."
- assertVisible: "Abrir ajustes"
- assertNotVisible:
    id: "offers-empty"
- takeScreenshot: build/maestro/offers-location-blocked

# The map is deliberately exempt from this gate: it has its own answer to a
# missing fix and stays useful without one. That exemption is a product
# decision, so it gets an assertion instead of a comment.
- tapOn:
    id: "offers-toggle-map"
- extendedWaitUntil:
    visible:
      id: "offers-map"
    timeout: 30000
- assertNotVisible:
    id: "offers-location-blocked"

# Back to the list: the refusal is still standing, and the CTA is still the one
# the OS-level denial calls for.
- tapOn:
    id: "offers-toggle-list"
- assertVisible:
    id: "offers-location-cta"
- takeScreenshot: build/maestro/offers-location-cta

# Restore. A URL-less launch with the permission back, so the next run — and the
# owner's next Cmd+R — starts from a granted map, not from this denial.
- stopApp
- launchApp:
    permissions:
      location: inuse
- extendedWaitUntil:
    visible: "Filtros"
    timeout: 90000
