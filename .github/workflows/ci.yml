name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Action majors are kept on the Node 24 runtime. GitHub deprecated Node 20 for
# actions and now force-runs those on 24, printing a deprecation annotation on
# EVERY job — a permanent warning that trains people to ignore CI annotations,
# and a countdown to the day the force-run stops being a courtesy.
#
# The floor is therefore checkout@v5 / setup-node@v5 / cache@v5 /
# paths-filter@v4 — the first major of each to declare node24. We run the
# latest instead, having read the majors in between: checkout v6 (creds to a
# separate file) and v7 (blocks fork checkout on pull_request_target /
# workflow_run — triggers this workflow does not use); setup-node v5/v6 (auto
# caching, which changes nothing here because every call sets `cache: npm`
# explicitly) and v7 (ESM); cache v6 (ESM). setup-php@v2 already targets node24,
# which is why it never appeared in the warnings.
#
# Do not downgrade any of these below the floor without re-reading the above.
#
# Every checkout passes `persist-credentials: false`. By default the action
# writes the job token into `.git/config`, where every later step can read it
# — including the third-party code that `composer install` and `npm ci` fetch
# and execute moments afterwards. Nothing here needs it: the only `git` in
# this file is a local `git diff` for contract drift. If a job ever does need
# to push or fetch, give THAT step the credential rather than all of them.

jobs:
  # Detect which areas a PR touches so unrelated jobs skip. On `main` pushes
  # every job runs regardless (see each job's `if`) — the M0 exit criterion.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # see the note above
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  api:
    name: API (Laravel)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    services:
      # MUST be the postgis image — the first migration runs `CREATE EXTENSION
      # postgis` (plus pg_trgm/unaccent/citext), which plain postgres lacks.
      # Credentials/db match apps/api/phpunit.xml so only DB_HOST needs override.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real-engine search tests (@group meilisearch) — the default suite runs
      # the collection driver, so this only serves that group.
      # v1.49 = what the dev compose stack currently runs (its `latest` volume);
      # the ^1.16 PHP SDK is forward-compatible with it (verified live).
      meilisearch:
        image: getmeili/meilisearch:v1.49
        ports:
          - 7700:7700
        env:
          MEILI_ENV: development
        options: >-
          --health-cmd "curl -fs http://localhost:7700/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # see the note above

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, gd, intl, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Lint (Pint)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer stan

      - name: Migrate database
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password

      - name: Tests (Pest)
        run: composer test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          # For the @group meilisearch suite; the default suite stays on the
          # collection driver via phpunit.xml.
          MEILISEARCH_HOST: http://127.0.0.1:7700

  contracts:
    name: Contracts
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # see the note above

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate types and check for drift
        run: |
          npm run generate -w packages/contracts
          git diff --exit-code packages/contracts/src/generated \
            || { echo "::error::Generated contracts are stale. Run 'npm run generate -w packages/contracts' and commit."; exit 1; }

      - name: Typecheck
        run: npm run typecheck -w packages/contracts

      - name: Tests (Jest)
        run: npm test -w packages/contracts

  mobile:
    name: Mobile (Expo)
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # see the note above

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/mobile

      - name: Typecheck
        run: npm run typecheck -w apps/mobile

      - name: Tests (Jest)
        run: npm test -w apps/mobile -- --ci
